<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Gallery</title>

    <!-- Favicon -->
    <link rel="icon" href="gallery-favicon.ico" type="image/x-icon">

    <!-- External CSS -->
    <link rel="stylesheet" href="body.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="header">
            <h1>Media Gallery Showcase</h1>
            <p>Featuring Images, Videos, and Interactive Maps</p>
        </div>
    </header>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <h2>Image Gallery</h2>
        <figure>
            <img src="image1.jpg" alt="Beautiful Landscape" loading="lazy">
            <figcaption>Landscape View</figcaption>
        </figure>
        <figure>
            <img src="image2.jpg" alt="Cityscape" loading="lazy">
            <figcaption>City View</figcaption>
        </figure>
    </section>

    <!-- Video Section -->
    <section class="video-section">
        <h2>Featured Video</h2>
        <video controls>
            <source src="sample-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>

    <!-- Audio Section -->
    <section class="audio-section">
        <h2>Listen to Audio</h2>
        <audio controls>
            <source src="sample-audio.mp3" type="audio/mp3">
            Your browser does not support the audio element.
        </audio>
    </section>

    <!-- Map Section -->
    <section class="map-section">
        <h2>Location Map</h2>
        <iframe 
            src="https://www.google.com/maps/embed?pb=some_location" 
            width="600" 
            height="450" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy">
        </iframe>
    </section>

    <!-- Footer Section -->
    <footer>
        <p>Contact us at: <a href="mailto:info@mediagallery.com">info@mediagallery.com</a></p>
    </footer>

</body>
</html>
